name: renovate
on:
  schedule:
  - cron: '8/30 * * * *'
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run Renovate
      uses: eidp/actions-common/renovate@11bfa25533857d8208bc809025b8589e10b1e61f # v1.4.2
      with:
        github-app-id: ${{ secrets.DEP_MANAGER_GITHUB_APP_ID }}
        github-app-pem: ${{ secrets.DEP_MANAGER_GITHUB_APP_PEM_FILE }}
        all-secrets: ${{ toJSON(secrets) }}
